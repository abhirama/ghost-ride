# Generated by newrepo (dotfiles #915): newrepo rewrites this file. Without this line it is reported as drift and left alone.
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "ruff"
      - dependency-name: "mypy"
    groups:
      version-updates:
        applies-to: "version-updates"
        patterns: ["*"]
      security-updates:
        applies-to: "security-updates"
        patterns: ["*"]
