# Type-check config (#643). Non-strict: bodies of unannotated functions are
# skipped, so a partly annotated repo is not buried in findings. New and
# changed signatures are annotated per ~/.claude/shared/python.md.
[mypy]
# Explicit for the same reason as ruff's target-version: 3.14 on the Mac,
# 3.12 on minions.
python_version = 3.12
# Two checked files sharing a basename outside a package otherwise abort the
# run with "Duplicate module named ...".
explicit_package_bases = True
# Report only on the files asked about, not on everything they import.
follow_imports = silent
ignore_missing_imports = True
